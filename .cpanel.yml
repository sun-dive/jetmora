---
# jetmora — © 2026 sun-dive — Business Source License 1.1, as LICENSE says of the deploy file.
# cPanel Git™ Version Control deployment for jetmora.org.
# In cPanel → Git Version Control: "Update from Remote", THEN "Deploy HEAD Commit". Push ≠ live.
# DEPLOYPATH mirrors the house convention ($HOME/<domain>/), as grafverse.com and bitgraf.com do.
#
# ⚠ A NEW FILE IS INVISIBLE UNTIL IT IS LISTED HERE. Adding a page to site/ is not enough.
# ⚠ This repo deploys ONLY its own files to ONLY its own docroot. It must never touch another site's.
deployment:
  tasks:
    - export DEPLOYPATH="$HOME/jetmora.org/"
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/cp site/index.html "$DEPLOYPATH/index.html"      # the paper — crawlable, self-contained, no CDN
    - /bin/cp site/.htaccess "$DEPLOYPATH/.htaccess"        # ⚠ Options -Indexes: this host lists directories by default
    - /bin/cp site/light-speed-transfers.html "$DEPLOYPATH/light-speed-transfers.html"   # the anchor-transfer paper v0.1 — the serious version; the Substack essay points here
    - /bin/cp site/og-light-speed.jpg "$DEPLOYPATH/og-light-speed.jpg"   # OG/Twitter card for the paper
    - /bin/cp site/robots.txt "$DEPLOYPATH/robots.txt"                   # allow all + sitemap pointer
    - /bin/cp site/sitemap.xml "$DEPLOYPATH/sitemap.xml"                 # index, compiler, paper, vectors
    # The specification and the vectors are published as static files so they can be cited and fetched.
    # ⚠ vectors/core.json is CC0 and IS the specification — an implementation reproducing it is conformant.
    # ⚠ spec/log.md is always the CURRENT version. Superseded versions are FROZEN and stay fetchable at
    #   their own URL, so anyone holding an older copy can tell which one it is. Never rename or replace.
    - /bin/mkdir -p "$DEPLOYPATH/spec" && /bin/cp spec/log.md "$DEPLOYPATH/spec/log.md"
    - /bin/cp spec/log-v0.1.md "$DEPLOYPATH/spec/log-v0.1.md"          # frozen 0.1, superseded 30 Aug
    # ── REMOVED PAGES ──────────────────────────────────────────────────────────────────────────────
    # A deploy copies and never deletes, so the deployed copies of a page taken off the site are deleted here.
    - /bin/rm -f "$DEPLOYPATH/bitcoin-racers.html" "$DEPLOYPATH/img/racers-shirt-88.webp" "$DEPLOYPATH/js/entry.mjs" "$DEPLOYPATH/js/merkle.mjs" "$DEPLOYPATH/js/sha256.mjs"
    # ── THE jetForth BASIC COMPILER, at /basic.html ───────────────────────────────────────────────
    # ⚠ basic/ and tools/ops-jf.mjs are COPIED at deploy from the files the tests run, never edited on the
    #   site. basic-jf.mjs imports ../tools/ops-jf.mjs, so the two folders keep their places side by side.
    - /bin/cp site/basic.html "$DEPLOYPATH/basic.html"
    - /bin/mkdir -p "$DEPLOYPATH/basic" "$DEPLOYPATH/tools"
    - /bin/cp basic/basic-jf.mjs basic/unbasic-jf.mjs basic/LICENSE "$DEPLOYPATH/basic/"
    - /bin/cp tools/ops-jf.mjs "$DEPLOYPATH/tools/ops-jf.mjs"
    - /bin/mkdir -p "$DEPLOYPATH/vectors" && /bin/cp vectors/core.json "$DEPLOYPATH/vectors/core.json"
    - /bin/cp vectors/LICENSE "$DEPLOYPATH/vectors/LICENSE"  # CC0 1.0, alongside the file it dedicates
    # ── THE THREAD SERVICE, at /threads/ ───────────────────────────────────────────────────────────
    # ⚠⚠ The database lives OUTSIDE the docroot. Inside one it is web-readable as well as writable.
    #    `server/data/` is gitignored, so a deploy can never overwrite a live database.
    - /bin/mkdir -p "$HOME/jetmora-data" && /bin/chmod 700 "$HOME/jetmora-data"
    - /bin/mkdir -p "$DEPLOYPATH/threads"
    - /bin/cp server/threads.php "$DEPLOYPATH/threads/index.php"   # the only endpoint; the rest are includes
    # every file threads.php requires up front: a missing one is a fatal error before any JSON can answer
    - /bin/cp server/store.php "$DEPLOYPATH/threads/store.php"
    - /bin/cp server/merkle.php "$DEPLOYPATH/threads/merkle.php"
    - /bin/cp server/genesis.php "$DEPLOYPATH/threads/genesis.php"
    - /bin/cp server/append.php "$DEPLOYPATH/threads/append.php"
    - /bin/cp server/head.php "$DEPLOYPATH/threads/head.php"
    - /bin/cp server/secp256k1.php "$DEPLOYPATH/threads/secp256k1.php"
    - /bin/cp server/rfc6979.php "$DEPLOYPATH/threads/rfc6979.php"
    - /bin/cp server/ed25519.php "$DEPLOYPATH/threads/ed25519.php"
    - /bin/cp server/covenant-entry.php "$DEPLOYPATH/threads/covenant-entry.php"
    # the judge, which append.php loads only when a tick is appended: a missing one breaks appends, never reads.
    # thread.php requires ../../ (threads/): covenant-entry, preimage, dispatch; the JF interpreter requires
    # ops-jf, secp256k1 (rfc6979) and ed25519. JF is the only set served here: an SV or BT tick gets no verdict.
    - /bin/cp server/dispatch.php "$DEPLOYPATH/threads/dispatch.php"
    - /bin/cp server/preimage.php "$DEPLOYPATH/threads/preimage.php"
    - /bin/cp server/interpreter-jf.php "$DEPLOYPATH/threads/interpreter-jf.php"
    - /bin/cp server/ops-jf.php "$DEPLOYPATH/threads/ops-jf.php"
    - /bin/mkdir -p "$DEPLOYPATH/threads/wallet/jetmora" && /bin/cp server/wallet/jetmora/thread.php "$DEPLOYPATH/threads/wallet/jetmora/thread.php"
    # ⛔ /log/ was the first home of the thread service, and the name was wrong: it is not a log. Removed, no redirect.
    - /bin/rm -rf "$DEPLOYPATH/log"
    # ⚠ emit-vectors.php and probe.php are development tools and are deliberately NOT deployed.
    - /bin/cp LICENSE "$DEPLOYPATH/LICENSE"                  # which licence covers which part
    - /bin/cp NOTICE "$DEPLOYPATH/NOTICE"                    # derivation + the Open BSV position + provenance
    - /bin/cp PROVENANCE.md "$DEPLOYPATH/PROVENANCE.md"      # the mint ledger
    - /bin/mkdir -p "$DEPLOYPATH/provenance"
    - /bin/cp provenance/*.ots "$DEPLOYPATH/provenance/"     # OpenTimestamps proofs
    - echo "jetmora.org ← $(git rev-parse --short HEAD)"
